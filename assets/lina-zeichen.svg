<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">Lina – Still, Heller Grund</title>
  <desc id="desc">Abstraktes KI-Zeichen mit geschlossenem Masters-grünem Außenring und radialem Lichtkern.</desc>
  <defs>
    <radialGradient id="lina-core" cx="50%" cy="50%" r="50%" color-interpolation="sRGB">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="28%" stop-color="#FFFFFF" stop-opacity="0.56"/>
      <stop offset="62%" stop-color="#045C3C" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#045C3C" stop-opacity="0.00"/>
    </radialGradient>
  </defs>
  <g id="lina-sign" data-state="still" data-ground="hell">
    <circle cx="256" cy="256" r="184" fill="none" stroke="#045C3C" stroke-width="24"/>
    <circle cx="256" cy="256" r="128" fill="#045C3C" fill-opacity="0.07" stroke="#045C3C" stroke-opacity="0.72" stroke-width="8"/>
    <circle cx="256" cy="256" r="112" fill="url(#lina-core)"/>
  </g>
</svg>
